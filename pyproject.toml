[project]
name = "paper-search-tool"
version = "1.1.0"
description = "OpenSearch：一句话说需求，多库并行检索，再由 LLM 挑出真正相关的几条"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "RomanCohort"}]
keywords = ["paper", "search", "llm", "arxiv", "europepmc", "openalex", "crossref", "pdb"]

dependencies = [
    "streamlit>=1.32",
    "langchain>=0.1",
    "openai>=1.14",
    "tiktoken>=0.6",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pillow>=10.2",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
